name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/DesignSpace.Tests -c Release
      - name: Pack portable libraries
        run: |
          for name in Core Engine Animation Xaml Rendering.Skia; do
            dotnet pack src/DesignSpace.$name -c Release -o artifacts/packages
          done
      - uses: actions/upload-artifact@v4
        with:
          name: portable-packages
          path: artifacts/packages
          if-no-files-found: error
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - run: dotnet build src/DesignSpace.Controls.Uno -c Release -f net10.0-desktop -p:DesignSpaceTargetFrameworks=net10.0-desktop
