name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source snapshot
        run: mkdir -p artifacts && git archive --format=zip --output=artifacts/DesignSpace-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: artifacts/DesignSpace-source.zip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/DesignSpace.Tests -c Release
      - run: dotnet run --project tests/DesignSpace.Compatibility.Tests -c Release
      - name: Verify layout, shaping, images and templates
        run: dotnet run --project tests/DesignSpace.Rendering.Tests -c Release
      - name: Verify vector geometry, editing and pixel fidelity
        run: dotnet run --project tests/DesignSpace.Vector.Tests -c Release
      - name: Verify trimmed persistence without reflection
        run: |
          dotnet publish tests/DesignSpace.Compatibility.Tests -c Release -r linux-x64 --self-contained true -p:PublishTrimmed=true -o artifacts/trimmed-tests
          artifacts/trimmed-tests/DesignSpace.Compatibility.Tests
      - name: Pack portable libraries
        run: |
          for name in Core Engine Animation Xaml Rendering.Skia; do
            dotnet pack src/DesignSpace.$name -c Release -o artifacts/packages
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-verification
          path: artifacts/verification
      - uses: actions/upload-artifact@v4
        with:
          name: portable-packages
          path: artifacts/packages
          if-no-files-found: error
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Build desktop application
        run: dotnet build src/DesignSpace.App -c Release -f net10.0-desktop -p:DesignSpaceTargetFrameworks=net10.0-desktop
