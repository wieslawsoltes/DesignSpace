name: Release artifacts
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml']
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.1.0-preview.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - name: Verify portable behavior and rendering
        run: |
          dotnet run --project tests/DesignSpace.Tests -c Release
          dotnet run --project tests/DesignSpace.Compatibility.Tests -c Release
          dotnet run --project tests/DesignSpace.Rendering.Tests -c Release
          dotnet run --project tests/DesignSpace.Vector.Tests -c Release
      - name: Pack eight independently reusable libraries
        run: |
          for name in Core Engine Animation Xaml Rendering.Skia Docking.Uno Controls.Uno Workbench.Uno; do
            dotnet pack src/DesignSpace.$name -c Release -p:Version="$VERSION" -o artifacts/packages
          done
          test "$(find artifacts/packages -name '*.nupkg' | wc -l)" -eq 8
      - name: Verify package contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          for p in Path('artifacts/packages').glob('*Uno*.nupkg'):
              with ZipFile(p) as z:
                  names=z.namelist()
              for framework in ('net10.0-desktop','net10.0-browserwasm'):
                  assert any(framework in n and n.endswith('.dll') for n in names),(p,framework)
              print('Verified desktop and browser assets:',p.name)
          PY
      - name: Archive source and checksums
        run: |
          git archive --format=zip --output=artifacts/DesignSpace-source.zip HEAD
          cd artifacts
          sha256sum packages/*.nupkg DesignSpace-source.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DesignSpace-release
          path: |
            artifacts/packages/*.nupkg
            artifacts/DesignSpace-source.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DesignSpace-release
          path: artifacts
      - name: Verify artifact checksums
        run: cd artifacts && sha256sum --check SHA256SUMS.txt
      - name: Publish tagged preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/packages/*.nupkg artifacts/DesignSpace-source.zip artifacts/SHA256SUMS.txt --verify-tag --generate-notes --prerelease
